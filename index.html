<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Олимпиадные достижения</title>
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--text:#10213a;--muted:#687386;--line:#e4ded1;--navy:#10213a;--gold:#c8ad78;--gold2:#b99a5e;--accent:#b99a5e;--accent2:#9f824b;--danger:#b42318;--shadow:0 12px 34px rgba(16,33,58,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body.dark{--bg:#0b1524;--card:#111e31;--text:#f7f2e8;--muted:#aab4c2;--line:#26364c;--navy:#e9ddc2;--gold:#d1b77f;--accent:#d1b77f;--accent2:#d7bf8e;--shadow:0 15px 40px rgba(0,0,0,.28)}
button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.header{position:sticky;top:0;z-index:20;background:rgba(255,253,248,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}body.dark .header{background:rgba(17,30,49,.94)}
.header-inner{max-width:1280px;margin:auto;padding:10px 24px;display:flex;gap:20px;align-items:center}.brand{display:flex;align-items:center;gap:12px;min-width:300px}.brand img{width:58px;height:58px;object-fit:contain}.logo{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:24px;line-height:1.02}.actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.btn.small{padding:7px 10px;font-size:13px}
.container{max-width:1280px;margin:auto;padding:30px 24px 45px}.hero{position:relative;overflow:hidden;margin:0 0 24px;border:1px solid var(--line);border-radius:22px;min-height:220px;padding:38px 42px;background:linear-gradient(115deg,#f8f0df 0%,#fffdf8 56%,#eee3cc 100%);box-shadow:var(--shadow)}body.dark .hero{background:linear-gradient(115deg,#182b44,#111e31 58%,#243b59)}.hero:after{content:"";position:absolute;right:-60px;top:-90px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(200,173,120,.25),transparent 65%)}
.hero-brand{display:flex;align-items:center;gap:22px;position:relative;z-index:1}.hero-brand img{width:118px;height:118px;object-fit:contain}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:40px;line-height:1.05;margin:0 0 9px;max-width:620px}.hero p{font-size:17px;margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.clickable{cursor:pointer;transition:.18s}.clickable:hover{transform:translateY(-2px)}.card h3{margin:0 0 8px}.card p{margin:0;color:var(--muted)}.back{margin-bottom:18px}.page-title{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:22px}.page-title h1{margin:0}
.class-section{margin:24px 0;scroll-margin-top:130px}.class-section h2{font-size:20px;margin:0 0 12px}.student-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.student-row{padding:13px 15px;border:1px solid var(--line);background:var(--card);border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.student-row strong{display:block}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:rgba(185,154,94,.14);color:var(--accent2)}
.achievements{display:grid;gap:10px;margin-top:18px}.achievement{border:1px solid var(--line);padding:14px;border-radius:12px;background:var(--card)}.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-backdrop.show{display:flex}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal h2{margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);outline:none}.field textarea{min-height:120px;resize:vertical}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.admin{border:1px solid var(--line);border-radius:17px;background:var(--card);padding:20px;margin-bottom:22px}.admin-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.admin-top h2{margin:0;flex:1}.admin-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;margin-top:18px}.roster{max-height:470px;overflow:auto;border:1px solid var(--line);border-radius:12px}.roster-item{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}.roster-item:last-child{border-bottom:0}.roster-item:hover{background:rgba(185,154,94,.08)}.roster-item strong{display:block}.search{margin-bottom:10px}.selected{background:rgba(185,154,94,.10)!important}.admin-note{font-size:13px;color:var(--muted);line-height:1.5}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--text)}.tab.active{background:var(--gold);border-color:var(--gold);color:#172238}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 24px}.stat-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:15px}.stat-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(200,173,120,.17);font-size:24px}.stat-value{font-size:29px;font-weight:800}.stat-label{color:var(--muted);font-size:13px;margin-top:3px}
.home-search{margin:0 0 24px}.home-search input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);outline:none;font-size:15px;box-shadow:var(--shadow)}.search-results{display:grid;gap:9px;margin-top:10px}.search-result{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.place-badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.place-gold{background:#f8e8b8;color:#76540d;border:1px solid #c9a95e}.place-silver{background:#eef0f2;color:#52606f;border:1px solid #aab3bd}.place-bronze{background:#f5dfca;color:#8b4c20;border:1px solid #c98a57}.place-participant{background:#dcecf0;color:#1e6170;border:1px solid #75aeb9}
.class-nav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px;padding:10px;position:sticky;top:80px;z-index:10;background:rgba(247,243,234,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:13px}body.dark .class-nav{background:rgba(11,21,36,.94)}.section-heading{display:flex;align-items:center;gap:10px;margin:30px 0 15px;font-family:Georgia,"Times New Roman",serif}.section-heading:before{content:"";width:7px;height:28px;border-radius:4px;background:var(--gold)}.olympiad-card{padding:0;overflow:hidden}.olympiad-top{background:var(--navy);color:#fff;padding:18px 20px;position:relative;min-height:105px}.olympiad-top:after{content:"✦";position:absolute;right:18px;top:10px;font-size:55px;opacity:.12}.olympiad-top h3{margin:0;font-size:18px}.olympiad-body{padding:18px 20px}.gold-link{color:var(--accent2);font-weight:700}.footer-note{text-align:center;color:var(--muted);margin-top:32px;font-family:Georgia,"Times New Roman",serif;font-size:16px}
@media(max-width:760px){.header-inner{padding:9px 13px}.brand{min-width:0}.brand img{width:46px;height:46px}.logo{font-size:18px}.container{padding:20px 13px}.hero{padding:24px 20px;min-height:190px}.hero h1{font-size:29px}.hero-brand{gap:12px}.hero-brand img{width:78px;height:78px}.stats-grid{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr}.class-nav{top:64px}.actions .btn span{display:none}.actions .btn{padding:9px 10px}}
</style>
</head>

 el.innerHTML=`<section class="hero"><h1>Олимпиадные достижения</h1><p class="muted">Выберите олимпиаду, чтобы посмотреть участников и их результаты.</p></section>
 <div class="grid">${state.olympiads.map(o=>`<div class="card clickable" onclick="nav('#/olympiad/${o.id}')"><h3>${esc(o.name)}</h3><p>${esc(o.description||"")}</p><div style="margin-top:16px"><span class="pill">${Object.keys(o.participants||{}).length} участников</span></div></div>`).join("")}</div>
 ${isAdmin?`<div class="admin" style="margin-top:24px"><div class="admin-top"><h2>Панель администратора</h2><button class="btn primary" onclick="nav('#/admin')">Открыть управление</button><button class="btn" onclick="logout()">Выйти</button></div></div>`:""}`;
}
function renderOlympiad(id){
 const o=olympiadById(id); if(!o)return renderHome();
 const entries=Object.entries(o.participants||{}).map(([sid,data])=>({s:studentById(sid),data})).filter(x=>x.s);
 const groups={}; entries.forEach(x=>(groups[x.s.class]??=[]).push(x));
 const classes=Object.keys(groups).sort((a,b)=>a.localeCompare(b,"ru",{numeric:true}));
 document.getElementById("app").innerHTML=`<div class="back"><button class="btn" onclick="nav('#/')">← Назад к списку олимпиад</button></div>
 <div class="page-title"><div><h1>${esc(o.name)}</h1><p class="muted">${esc(o.description||"")}</p></div>${isAdmin?`<button class="btn primary" onclick="openAddStudent('${o.id}')">＋ Добавить ученика</button>`:""}</div>
 ${classes.length?classes.map(cls=>`<section class="class-section"><h2>${esc(cls)}</h2><div class="student-list">${groups[cls].map(x=>`<div class="student-row clickable" onclick="nav('#/student/${o.id}/${x.s.id}')"><div><strong>${esc(x.s.name)}</strong><span class="muted">${x.data.achievements?.length||0} достижений</span></div><span>→</span></div>`).join("")}</div></section>`).join(""):`<div class="empty">Пока нет участников.${isAdmin?` Нажми «Добавить ученика».`:""}</div>`}`;
}
function renderStudent(oid,sid){
 const o=olympiadById(oid), s=studentById(sid); if(!o||!s)return renderHome();
 const data=o.participants[sid]||{achievements:[]};
 document.getElementById("app").innerHTML=`<div class="back"><button class="btn" onclick="nav('#/olympiad/${o.id}')">← Назад к олимпиаде</button></div>
 <div class="card"><span class="pill">${esc(s.class)}</span><h1 style="margin:12px 0 4px">${esc(s.name)}</h1><p class="muted">${esc(o.name)}</p>
 <h2 style="margin-top:26px">Достижения</h2>
 <div class="achievements">${data.achievements?.length?data.achievements.map((a,i)=>`<div class="achievement"><strong>${i+1}.</strong> ${esc(a)}</div>`).join(""):`<div class="empty">Достижения пока не добавлены.</div>`}</div>
 ${isAdmin?`<div style="margin-top:18px"><button class="btn primary" onclick="openAchievement('${o.id}','${s.id}')">✎ Изменить достижения</button><button class="btn danger" style="margin-left:8px" onclick="removeStudent('${o.id}','${s.id}')">Удалить из олимпиады</button></div>`:""}
 </div>`;
}

function openModal(content){document.getElementById("modal").innerHTML=content;document.getElementById("modalBackdrop").classList.add("show");}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("show");}
function backdropClose(e){if(e.target.id==="modalBackdrop")closeModal()}

function openAdminLogin(){
 if(isAdmin){nav('#/admin');return}
 openModal(`<h2>Вход администратора</h2><div class="field"><label>Пароль</label><input id="adminPass" type="password" autofocus placeholder="Введите пароль"></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="login()">Войти</button></div>`);
 setTimeout(()=>document.getElementById("adminPass")?.focus(),50);
}
function login(){if(document.getElementById("adminPass").value===ADMIN_PASSWORD){isAdmin=true;sessionStorage.setItem(ADMIN_KEY,"1");closeModal();nav('#/admin')}else alert("Неверный пароль");}
function logout(){isAdmin=false;sessionStorage.removeItem(ADMIN_KEY);nav('#/')}
function renderAdmin(){
 if(!isAdmin)return openAdminLogin();
 document.getElementById("app").innerHTML=`<div class="back"><button class="btn" onclick="nav('#/')">← На главную</button></div>
 <div class="page-title"><div><h1>Панель администратора</h1><p class="muted">Здесь ты добавляешь учеников в конкретную олимпиаду и сразу записываешь их достижения.</p></div><button class="btn" onclick="logout()">Выйти</button></div>
 <div class="admin"><div class="admin-top"><h2>Олимпиады</h2><button class="btn primary" onclick="addOlympiad()">＋ Новая олимпиада</button></div>
 <div class="tabs" style="margin-top:15px">${state.olympiads.map((o,i)=>`<button class="tab ${i===0?'active':''}" onclick="openAdminOlympiad('${o.id}')">${esc(o.name)}</button>`).join("")}</div>
 <div id="adminContent"></div></div>`;
 if(state.olympiads[0])openAdminOlympiad(state.olympiads[0].id);
}
function openAdminOlympiad(oid){
 const o=olympiadById(oid); if(!o)return;
 const box=document.getElementById("adminContent"); if(!box)return;
 box.innerHTML=`<div class="admin-top"><div><h2 style="margin:0">${esc(o.name)}</h2><div class="muted">${Object.keys(o.participants||{}).length} участников</div></div><button class="btn primary" onclick="openAddStudent('${oid}')">＋ Добавить ученика</button><button class="btn" onclick="editOlympiad('${oid}')">Настроить</button></div>
 <div class="admin-grid"><div><h3>Уже добавлены</h3><div class="roster">${Object.keys(o.participants||{}).map(sid=>{const s=studentById(sid);return s?`<div class="roster-item selected" onclick="openAchievement('${oid}','${sid}')"><strong>${esc(s.name)}</strong><span class="muted">${esc(s.class)} · ${o.participants[sid].achievements?.length||0} достиж.</span></div>`:""}).join("") || `<div class="empty">Пока никто не добавлен.</div>`}</div></div>
 <div><h3>Как добавить</h3><p class="admin-note">Нажми «Добавить ученика». Появится список всех учеников школы. Нажми на имя — откроется окно достижений. Впиши достижения и нажми <b>Enter</b>. Ученик сразу появится в панели участников.</p><button class="btn danger" onclick="deleteOlympiad('${oid}')">Удалить олимпиаду</button></div></div>`;
}
function openAddStudent(oid){
 const o=olympiadById(oid);
 openModal(`<h2>Добавить ученика — ${esc(o.name)}</h2><div class="field search"><label>Поиск по имени или классу</label><input id="studentSearch" oninput="filterRoster('${oid}')" placeholder="Например: Али или 8а" autofocus></div><div class="roster" id="addRoster">${renderRoster(oid,"")}</div><div class="modal-footer"><button class="btn" onclick="closeModal()">Закрыть</button></div>`);
 setTimeout(()=>document.getElementById("studentSearch")?.focus(),50);
}
function renderRoster(oid,q){
 const o=olympiadById(oid), lower=q.toLowerCase();
 return SCHOOL_STUDENTS.filter(s=>(s.name+" "+s.class).toLowerCase().includes(lower)).map(s=>{
 const added=!!o.participants[s.id];
 return `<div class="roster-item ${added?'selected':''}" onclick="${added?`openAchievement('${oid}','${s.id}')`:`openAchievement('${oid}','${s.id}')`}"><strong>${esc(s.name)}</strong><span class="muted">${esc(s.class)} ${added?"· уже добавлен":""}</span></div>`;
 }).join("") || `<div class="empty">Ничего не найдено.</div>`;
}
function filterRoster(oid){document.getElementById("addRoster").innerHTML=renderRoster(oid,document.getElementById("studentSearch").value)}
function openAchievement(oid,sid){
 const o=olympiadById(oid),s=studentById(sid), old=(o.participants[sid]?.achievements||[]);
 openModal(`<h2>${o.participants[sid]?"Редактировать":"Добавить"} ученика</h2><p><b>${esc(s.name)}</b> <span class="pill">${esc(s.class)}</span></p>
 <div class="field"><label>Достижения</label><textarea id="achievementInput" placeholder="Например:\n1 место — районная олимпиада\nДиплом II степени — областной этап">${esc(old.join("\\n"))}</textarea><div class="admin-note">Каждое достижение — с новой строки. <b>Enter</b> сохраняет ученика. Для новой строки используй <b>Shift + Enter</b>.</div></div>
 <div class="modal-footer"><button class="btn" onclick="closeModal()">Отмена</button>${o.participants[sid]?`<button class="btn danger" onclick="removeStudent('${oid}','${sid}')">Удалить</button>`:""}<button class="btn primary" onclick="saveAchievement('${oid}','${sid}')">Сохранить</button></div>`);
 const ta=document.getElementById("achievementInput"); ta.focus(); ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();saveAchievement(oid,sid)}})
}
function saveAchievement(oid,sid){
 const o=olympiadById(oid),v=document.getElementById("achievementInput").value;
 o.participants[sid]={achievements:v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)};
 save();closeModal();nav('#/olympiad/'+oid);
 if(location.hash==="#/admin"){renderAdmin();setTimeout(()=>openAdminOlympiad(oid),0)}
}
function removeStudent(oid,sid){
 if(!confirm("Удалить ученика из этой олимпиады?"))return;
 delete olympiadById(oid).participants[sid];save();closeModal();nav('#/olympiad/'+oid);
}
function addOlympiad(){
 openModal(`<h2>Новая олимпиада</h2><div class="field"><label>Название</label><input id="newO" placeholder="Например: Информатика"></div><div class="field"><label>Описание</label><input id="newD" placeholder="Краткое описание"></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="createOlympiad()">Создать</button></div>`);
}
function createOlympiad(){const name=document.getElementById("newO").value.trim();if(!name)return alert("Введите название");const id="o"+Date.now();state.olympiads.push({id,name,description:document.getElementById("newD").value.trim(),participants:{}});save();closeModal();nav('#/admin')}
function editOlympiad(oid){
 const o=olympiadById(oid);
 openModal(`<h2>Настройки олимпиады</h2><div class="field"><label>Название</label><input id="editO" value="${esc(o.name)}"></div><div class="field"><label>Описание</label><input id="editD" value="${esc(o.description||"")}"></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="saveOlympiad('${oid}')">Сохранить</button></div>`);
}
function saveOlympiad(oid){const o=olympiadById(oid);o.name=document.getElementById("editO").value.trim()||o.name;o.description=document.getElementById("editD").value.trim();save();closeModal();renderAdmin()}
function deleteOlympiad(oid){if(state.olympiads.length<=1)return alert("Нельзя удалить последнюю олимпиаду.");if(confirm("Удалить эту олимпиаду и всех её участников?")){state.olympiads=state.olympiads.filter(o=>o.id!==oid);save();renderAdmin()}}

/* Улучшения */
function achievementBadges(a){
 const out=[];(a||[]).forEach(x=>{const t=String(x).toLocaleLowerCase("ru");
 if(/(^|[^\d])1\s*(место|мест\.)|перв(ое|ый)\s*(место)?|🥇/.test(t))out.push('<span class="place-badge place-gold">🥇 1 место</span>');
 else if(/(^|[^\d])2\s*(место|мест\.)|втор(ое|ой)\s*(место)?|🥈/.test(t))out.push('<span class="place-badge place-silver">🥈 2 место</span>');
 else if(/(^|[^\d])3\s*(место|мест\.)|треть(е|ий)\s*(место)?|🥉/.test(t))out.push('<span class="place-badge place-bronze">🥉 3 место</span>');
 else if(/участник|участие|сертификат|диплом/.test(t))out.push('<span class="place-badge place-participant">📜 Участник</span>')});
 return [...new Set(out)].join(" ");
}
function searchStudentsHome(){
 const q=(document.getElementById("homeStudentSearch")?.value||"").trim().toLocaleLowerCase("ru"),box=document.getElementById("homeSearchResults"),grid=document.getElementById("olympiadGrid");
 if(!q){box.innerHTML="";grid.style.display="grid";return} grid.style.display="none";
 const rows=[];SCHOOL_STUDENTS.filter(s=>s.name.toLocaleLowerCase("ru").includes(q)).forEach(s=>state.olympiads.forEach(o=>{if(o.participants?.[s.id])rows.push(`<div class="search-result" onclick="nav('#/student/${o.id}/${s.id}')"><div><strong>${esc(s.name)}</strong><div class="muted">${esc(s.class)} · ${esc(o.name)}</div></div><span>→</span></div>`)}));
 box.innerHTML=rows.length?`<div class="search-results">${rows.join("")}</div>`:`<div class="empty">По запросу ничего не найдено.</div>`;
}

function renderOlympiad(id){
 const o=olympiadById(id);if(!o)return renderHome();const e=Object.entries(o.participants||{}).map(([sid,data])=>({s:studentById(sid),data})).filter(x=>x.s),g={};e.forEach(x=>(g[x.s.class]??=[]).push(x));const cs=Object.keys(g).sort((a,b)=>a.localeCompare(b,"ru",{numeric:true}));
 document.getElementById("app").innerHTML=`<div class="back"><button class="btn" onclick="nav('#/')">← Назад к списку олимпиад</button></div><div class="page-title"><div><h1>${esc(o.name)}</h1><p class="muted">${esc(o.description||"")}</p></div>${isAdmin?`<button class="btn primary" onclick="openAddStudent('${o.id}')">＋ Добавить ученика</button>`:""}</div>
 ${cs.length?`<div class="class-nav">${cs.map(c=>`<button class="tab" onclick="document.getElementById('class-${o.id}-${encodeURIComponent(c)}')?.scrollIntoView({behavior:'smooth',block:'start'})">${esc(c)}</button>`).join("")}</div>${cs.map(c=>`<section class="class-section" id="class-${o.id}-${encodeURIComponent(c)}"><h2>${esc(c)}</h2><div class="student-list">${g[c].map(x=>`<div class="student-row clickable" onclick="nav('#/student/${o.id}/${x.s.id}')"><div><strong>${esc(x.s.name)}</strong><span class="muted">${x.data.achievements?.length||0} достижений</span></div><div>${achievementBadges(x.data.achievements)}</div></div>`).join("")}</div></section>`).join("")}`:`<div class="empty">Пока нет участников.${isAdmin?` Нажми «Добавить ученика».`:""}</div>`}`;
}
function renderStudent(oid,sid){
 const o=olympiadById(oid),s=studentById(sid);if(!o||!s)return renderHome();const d=o.participants[sid]||{achievements:[]};
 document.getElementById("app").innerHTML=`<div class="back"><button class="btn" onclick="nav('#/olympiad/${o.id}')">← Назад к олимпиаде</button></div><div class="card"><span class="pill">${esc(s.class)}</span><h1 style="margin:12px 0 4px">${esc(s.name)}</h1><p class="muted">${esc(o.name)}</p><h2 style="margin-top:26px">Достижения</h2><div class="achievements">${d.achievements?.length?d.achievements.map((a,i)=>`<div class="achievement"><div style="display:flex;justify-content:space-between;gap:10px"><div><strong>${i+1}.</strong> ${esc(a)}</div><div>${achievementBadges([a])}</div></div></div>`).join(""):`<div class="empty">Достижения пока не добавлены.</div>`}</div>${isAdmin?`<div style="margin-top:18px"><button class="btn primary" onclick="openAchievement('${o.id}','${s.id}')">✎ Изменить достижения</button><button class="btn danger" style="margin-left:8px" onclick="removeStudent('${o.id}','${s.id}')">Удалить из олимпиады</button></div>`:""}</div>`;
}

render();
